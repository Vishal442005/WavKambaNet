[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wav-kambanet"
version = "1.0.0"
description = "Wav-KambaNet: Dynamic Spatial Graph Wavelet Kolmogorov-Arnold State-Space Networks for Robust Multiclass EEG Motor Imagery Decoding"
authors = [
    { name = "BCI Research Team" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mne>=1.5.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0"
]

[project.urls]
Homepage = "https://github.com/your-username/Wav-KambaNet"
Repository = "https://github.com/your-username/Wav-KambaNet.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
